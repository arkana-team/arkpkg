[workspace]
members = ["."]

# Keep this in sync with the `rust` image tag in `Dockerfile` and with
# `rust-version` below. CI builds inside that image, so a stale pin silently
# leaves the project on an old compiler (and breaks once the tag is unpublished).
[package]
name = "arkpkg"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["arkanaOS Team"]
description = "Official package manager for arkanaOS"
license = "GPL-3.0"

[lib]
name = "arkpkg"
path = "src/lib.rs"

[[bin]]
name = "arkpkg"
path = "src/main.rs"

[[bin]]
name = "arkpkg-build"
path = "src/bin/arkpkg-build.rs"

[dependencies]
cap-std = "3.4.5"
cap-tempfile = "3.4.5"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
lz4_flex = "0.11"
sha2 = "0.10"
walkdir = "2.5"
tempfile = "3.20"
rustix = { version = "1.1", features = ["fs"] }
rustix-linux-procfs = "0.1.1"
chrono = "0.4"
thiserror = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
